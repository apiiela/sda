<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legally Blonde JR | SDA Productions WA</title>
<meta name="description" content="SDA Productions WA presents Legally Blonde JR. Coming soon. 30–31 January 2027.">
<meta name="theme-color" content="#e0198a">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{background:#d4157f}
body{min-height:100vh;min-height:100svh;color:#fff;font:400 1rem/1.6 Montserrat,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1rem,3vh,2rem);text-align:center;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom,0px));position:relative;isolation:isolate;overflow-x:clip;background:radial-gradient(ellipse at 50% 0,#ff7cc4,transparent 60%),linear-gradient(160deg,#ff4fab,#e0198a 55%,#b80a6b)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:4px;border-radius:8px}
/* SDA logo: the PNG has lots of empty margin, so crop to the visible mark */
.sda{display:block;position:relative;overflow:hidden;width:clamp(120px,22vw,160px);aspect-ratio:2509/1436;animation:fade 1.2s .1s both}
.sda img{position:absolute;max-width:none;width:170.23%;left:-35.67%;top:-101.25%}
/* stage: logo with the dog standing on top of it */
.stage{--w:max(280px,min(640px,100vw - 3rem,calc((100svh - 21rem)*1.28)));position:relative;width:var(--w);margin-top:calc(var(--w)*.19);animation:rise 1.2s .25s cubic-bezier(.16,1,.3,1) both}
.stage::before{content:"";position:absolute;z-index:-1;inset:-42% -28% -22%;background:radial-gradient(closest-side,#fff 0,#fff 30%,#ffd9ee 60%,rgba(255,190,225,0) 100%)}
.logo{display:block;width:100%;height:auto;margin-bottom:-9%}
.dog{position:absolute;z-index:2;right:6%;width:36%;bottom:70.4%;cursor:pointer;animation:drop 1.1s 1.1s both}
.hp{position:relative}
.dog img{display:block;width:100%;height:auto;transform-origin:50% 90%;filter:drop-shadow(0 10px 12px rgba(120,0,70,.35));animation:sway 4.2s ease-in-out 2.3s infinite}
.tw{position:absolute;left:36%;top:53%;width:1.6rem;height:1.6rem;margin:-.8rem;background:radial-gradient(circle,#fff 0 12%,transparent 14%),conic-gradient(from 0deg,transparent 0 40deg,#fff 45deg,transparent 50deg 130deg,#fff 135deg,transparent 140deg 220deg,#fff 225deg,transparent 230deg 310deg,#fff 315deg,transparent 320deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 72%);mask:radial-gradient(circle,#000 30%,transparent 72%);animation:twinkle 2.4s ease-in-out 2.4s infinite;pointer-events:none}
.hp.hop{animation:hop .7s cubic-bezier(.3,.7,.4,1)}
.say{position:absolute;z-index:3;right:40%;top:-10.4%;transform:translateY(-50%);padding:.45rem 1rem;border-radius:18px;background:#fff;color:#d4157f;font-weight:800;font-size:clamp(.85rem,2.6vw,1.3rem);letter-spacing:-.01em;white-space:nowrap;box-shadow:0 8px 24px rgba(120,0,70,.3);transform-origin:100% 100%;animation:bubble .7s 2.3s cubic-bezier(.3,1.6,.5,1) both}
.say::after{content:"";position:absolute;left:100%;top:50%;margin-top:-.2rem;border:.55rem solid transparent;border-left-color:#fff;border-right:0}
.soon{font-weight:800;font-size:clamp(2rem,5.5vw,3.2rem);letter-spacing:-.035em;line-height:1.05;text-shadow:0 2px 24px rgba(120,0,70,.4);animation:rise 1.1s .7s cubic-bezier(.16,1,.3,1) both}
.dates{margin-top:.5rem;font-weight:600;font-size:clamp(1.05rem,2.6vw,1.35rem);letter-spacing:.02em;text-shadow:0 2px 18px rgba(120,0,70,.4);animation:rise 1.1s .9s cubic-bezier(.16,1,.3,1) both}
.bars{width:4.5rem;height:3px;margin:1.1rem auto 0;background:#fff;opacity:.8;border-radius:3px;animation:draw 1.2s 1.1s cubic-bezier(.16,1,.3,1) both}
.back{font-size:.85rem;opacity:.85;border-bottom:1px solid rgba(255,255,255,.6);animation:fade 1.2s 1.3s both}
.back:hover{opacity:1}
.sp{position:absolute;z-index:-1;color:#fff;opacity:0;pointer-events:none;animation:float linear infinite}
.ht{position:fixed;z-index:9;pointer-events:none;color:#fff;font-size:1.4rem;text-shadow:0 2px 10px rgba(120,0,70,.5);animation:burst .9s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes drop{0%{opacity:0;transform:translateY(-160%) rotate(-14deg)}55%{opacity:1;transform:translateY(7%) rotate(3deg) scaleY(.9)}78%{transform:translateY(-3%) scaleY(1.03)}100%{transform:none}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg) translateY(-3px)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.8;transform:scale(.8) rotate(60deg)}}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-22%) rotate(-8deg) scaleY(1.06)}65%{transform:translateY(0) rotate(5deg) scaleY(.92)}}
@keyframes bubble{from{opacity:0;transform:translateY(-50%) scale(0) rotate(-8deg)}}
@keyframes float{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:.5}85%{opacity:.35}100%{opacity:0;transform:translateY(-70vh) rotate(90deg)}}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3) rotate(25deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.sp{display:none}}
</style>
</head>
<body>
<a href="../" aria-label="SDA Productions WA home" class="sda"><img src="../SDAWhite.png" alt="SDA Productions WA"></a>

<main style="display:contents">
  <div class="stage">
    <h1 style="font-size:0"><img class="logo" src="../LEGALLYBLONDEJR_LOGO_FULL_4C.png" alt="Legally Blonde JR"></h1>
    <div class="dog" id="dog" title="Say hi"><div class="hp" id="hp"><img src="../LEGALLYBLONDE_XA_DOG_4C.png" alt="" decoding="async"><span class="tw" aria-hidden="true"></span></div></div>
    <p class="say" id="say" aria-hidden="true">Woof!</p>
  </div>
  <div>
    <p class="soon">Coming soon</p>
    <p class="dates">30 – 31 January 2027</p>
    <div class="bars"></div>
  </div>
</main>

<a class="back" href="../">Back to SDA Productions WA</a>

<script>
const calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
if(!calm){
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.className='sp';s.textContent='✦';s.setAttribute('aria-hidden','true');
    s.style.cssText='left:'+(Math.random()*96)+'%;bottom:-2rem;font-size:'+(.7+Math.random()*1.3)+'rem;animation-duration:'+(14+Math.random()*12)+'s;animation-delay:'+(-Math.random()*20)+'s';
    document.body.appendChild(s);
  }
}
/* tap the dog: she hops, says something, and hearts fly out */
const lines=['Bend & snap!','Omigod!','Woof!','Coming soon!'];
let n=0;
const dog=document.getElementById('dog'),hp=document.getElementById('hp'),say=document.getElementById('say');
dog.addEventListener('click',e=>{
  say.textContent=lines[n++%lines.length];
  if(calm)return;
  hp.classList.remove('hop');void hp.offsetWidth;hp.classList.add('hop');
  const r=dog.getBoundingClientRect(),cx=r.left+r.width*.45,cy=r.top+r.height*.4;
  for(let i=0;i<9;i++){
    const h=document.createElement('span'),a=Math.PI*2*i/9+Math.random()*.5,d=70+Math.random()*70;
    h.className='ht';h.textContent='♥';
    h.style.cssText='left:'+cx+'px;top:'+cy+'px;--x:'+Math.cos(a)*d+'px;--y:'+(Math.sin(a)*d-30)+'px;color:'+(i%2?'#fff':'#ffd0ea');
    document.body.appendChild(h);setTimeout(()=>h.remove(),900);
  }
});
</script>
</body>
</html>
