<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Audition Season | SDA Productions WA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hotpink: '#D81159',
                        shrekGreen: '#A6C400',
                        shrekDark: '#5C7A00',
                        charcoal: '#111111',
                        cream: '#FDFBF7'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        shrek: ['"Luckiest Guy"', 'cursive'],
                        nunito: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #111111;
            color: #FDFBF7;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .glass-header {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- Unified Hover & Mobile Active States --- */

        .bg-zoom {
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .split-panel:hover .bg-zoom,
        .split-panel.is-active .bg-zoom {
            transform: scale(1.05);
        }

        .overlay-transition {
            transition: background-color 0.6s ease;
        }
        .split-panel:hover .overlay-pink,
        .split-panel.is-active .overlay-pink {
            background-color: rgba(216, 17, 89, 0.5);
        }
        .split-panel:hover .overlay-green,
        .split-panel.is-active .overlay-green {
            background-color: rgba(166, 196, 0, 0.5);
        }

        .content-shift {
            transform: translateY(0);
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .split-panel:hover .content-shift,
        .split-panel.is-active .content-shift {
            transform: translateY(-0.5rem);
        }

        /* Button Colors */
        .btn-legally {
            background-color: #D81159;
            color: #ffffff;
            border-color: rgba(216, 17, 89, 0.5);
            box-shadow: 0 0 20px rgba(216, 17, 89, 0.3);
            transition: all 0.3s ease;
        }
        .split-panel:hover .btn-legally,
        .split-panel.is-active .btn-legally {
            background-color: #ffffff;
            color: #D81159;
            box-shadow: 0 10px 30px rgba(216, 17, 89, 0.6);
            transform: scale(1.05);
        }

        .btn-shrek {
            background-color: #A6C400;
            color: #111111;
            border-color: rgba(166, 196, 0, 0.5);
            box-shadow: 0 0 20px rgba(166, 196, 0, 0.3);
            transition: all 0.3s ease;
        }
        .split-panel:hover .btn-shrek,
        .split-panel.is-active .btn-shrek {
            background-color: #ffffff;
            color: #5C7A00;
            box-shadow: 0 10px 30px rgba(166, 196, 0, 0.6);
            transform: scale(1.05);
        }

        .shrek-title-shadow {
            text-shadow: 2px 2px 0px #111111, 4px 4px 10px rgba(0,0,0,0.5);
        }

        /* Mobile Scroll Prompt Animation - Improved */
        @keyframes strongBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }
        .animate-strong-bounce {
            animation: strongBounce 2s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative">

    <header class="fixed top-0 left-0 w-full z-50 glass-header py-4 px-6 md:px-12 flex justify-between items-center">
        <div class="font-sans font-bold tracking-widest text-xs md:text-sm uppercase text-gray-300">
            SDA Productions WA
        </div>
        <div class="font-serif italic text-gray-300 text-sm md:text-base">
            2027 Audition Season
        </div>
    </header>

    <main class="flex-grow flex flex-col md:flex-row w-full md:h-screen pt-[60px] md:pt-0">

        <a href="/shrek/auditions/" class="split-panel relative w-full md:w-1/2 min-h-[90vh] md:min-h-0 md:h-full flex items-center justify-center overflow-hidden cursor-pointer block border-b md:border-b-0 md:border-r border-white/10 relative">
            
            <img src="../shrek/DSCF2029.JPG" alt="Shrek KIDS" class="absolute inset-0 w-full h-full object-cover bg-zoom opacity-60">
            
            <div class="absolute inset-0 bg-gradient-to-t from-charcoal via-charcoal/60 to-transparent z-10"></div>
            <div class="absolute inset-0 bg-charcoal/50 overlay-transition overlay-green z-10"></div>

            <div class="relative z-20 w-full max-w-2xl mx-auto text-center px-6 flex flex-col items-center justify-center content-shift pb-16 md:pb-0">
                <p class="text-shrekGreen font-bold tracking-[0.25em] text-lg md:text-xl lg:text-2xl uppercase mb-4 drop-shadow-md font-nunito">Ages 7–12</p>
                <h2 class="font-shrek text-7xl md:text-8xl lg:text-9xl mb-2 leading-none text-white tracking-wide shrek-title-shadow">SHREK</h2>
                <h3 class="font-shrek text-4xl md:text-5xl lg:text-6xl text-shrekGreen mb-10 tracking-widest drop-shadow-md">KIDS</h3>
                
                <div class="flex items-center justify-center gap-3 text-gray-100 mb-10 font-bold text-lg md:text-xl bg-black/60 px-8 py-4 rounded-full backdrop-blur-md border-2 border-white/10 font-nunito w-max mx-auto shadow-lg">
                    <svg class="w-6 h-6 text-shrekGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span>Auditions: 22 Nov 2026</span>
                </div>

                <span class="btn-shrek px-10 py-5 rounded-full font-bold text-lg md:text-xl tracking-wide border-2 inline-block font-nunito">
                    View Audition Pack
                </span>
            </div>

            <div class="md:hidden absolute bottom-8 w-full flex justify-center z-30 pointer-events-none">
                <div class="bg-black/50 backdrop-blur-md border border-white/20 px-6 py-3 rounded-full flex flex-col items-center shadow-2xl animate-strong-bounce">
                    <span class="font-sans text-xs uppercase tracking-[0.3em] mb-1 font-bold text-gray-200">Scroll Down</span>
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                </div>
            </div>
        </a>

        <a href="/legallyblonde/auditions/" class="split-panel relative w-full md:w-1/2 min-h-[90vh] md:min-h-0 md:h-full flex items-center justify-center overflow-hidden cursor-pointer block">
            
            <img src="../homeimages/HSMJR2026(19-07-2026)-20 (1).jpg" alt="Legally Blonde JR" class="absolute inset-0 w-full h-full object-cover bg-zoom opacity-60">
            
            <div class="absolute inset-0 bg-gradient-to-t from-charcoal via-charcoal/60 to-transparent z-10"></div>
            <div class="absolute inset-0 bg-charcoal/50 overlay-transition overlay-pink z-10"></div>

            <div class="relative z-20 w-full max-w-2xl mx-auto text-center px-6 flex flex-col items-center justify-center content-shift">
                <p class="text-hotpink font-bold tracking-[0.25em] text-lg md:text-xl lg:text-2xl uppercase mb-4 drop-shadow-md">Ages 13–18</p>
                <h2 class="font-serif text-6xl md:text-7xl lg:text-8xl font-bold mb-2 leading-tight text-white drop-shadow-xl">Legally Blonde</h2>
                <h3 class="font-serif text-4xl md:text-5xl lg:text-6xl italic text-hotpink mb-10 drop-shadow-md">JR.</h3>
                
                <div class="flex items-center justify-center gap-3 text-gray-100 mb-10 font-bold text-lg md:text-xl bg-black/60 px-8 py-4 rounded-full backdrop-blur-md border-2 border-white/10 w-max mx-auto shadow-lg">
                    <svg class="w-6 h-6 text-hotpink" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span>Auditions: 8 Nov 2026</span>
                </div>

                <span class="btn-legally px-10 py-5 rounded-full font-bold text-lg md:text-xl tracking-wide border-2 inline-block">
                    View Audition Pack
                </span>
            </div>
        </a>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const isTouchDevice = window.matchMedia("(hover: none)").matches;

            if (isTouchDevice) {
                const panels = document.querySelectorAll('.split-panel');
                
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-active');
                        } else {
                            entry.target.classList.remove('is-active');
                        }
                    });
                }, {
                    threshold: 0.55 
                });

                panels.forEach(panel => observer.observe(panel));
            }
        });
    </script>
</body>
</html>
